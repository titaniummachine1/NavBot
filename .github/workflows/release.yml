name: Auto Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get version from commit
        id: version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$COMMIT_MSG" =~ ^(major|breaking|BREAKING) ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSG" =~ ^(feat|feature|minor) ]]; then
            BUMP_TYPE="minor"
          elif [[ "$COMMIT_MSG" =~ ^(fix|patch|bug|hotfix|update) ]]; then
            BUMP_TYPE="patch"
          else
            BUMP_TYPE="patch"
          fi

          if [ -f package.json ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
          else
            CURRENT_VERSION="1.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update version in package.json
        if: steps.version.outputs.skip != 'true'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Read bundle output filename
        if: steps.version.outputs.skip != 'true'
        id: bundle_name
        run: echo "name=$(tr -d '\r' < title.txt)" >> "$GITHUB_OUTPUT"

      - name: Bundle NavBot
        if: steps.version.outputs.skip != 'true'
        run: node bundle.js

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NavBot v${{ steps.version.outputs.version }}
          body: |
            ## NavBot v${{ steps.version.outputs.version }}

            **Changes:** ${{ github.event.head_commit.message }}

            **Version bump:** ${{ steps.version.outputs.bump_type }}

            ### Installation
            1. Download `${{ steps.bundle_name.outputs.name }}` from Assets
            2. Place in your LMAOBox Lua folder
            3. Load in LMAOBox

            **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          files: ${{ steps.bundle_name.outputs.name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
