name: Bundle NavBot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Bundle NavBot
      run: |
        node bundle.js
        
    - name: Upload NavBot.lua
      uses: actions/upload-artifact@v3
      with:
        name: NavBot
        path: NavBot.lua
