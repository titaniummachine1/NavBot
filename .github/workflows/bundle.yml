name: Bundle NavBot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Get version from commit
      id: version
      run: |
        # Extract version bump type from commit message
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        if [[ "$COMMIT_MSG" =~ ^(major|feat|breaking|BREAKING) ]]; then
          BUMP_TYPE="major"
        elif [[ "$COMMIT_MSG" =~ ^(minor|feature|feat|new) ]]; then
          BUMP_TYPE="minor"
        elif [[ "$COMMIT_MSG" =~ ^(patch|fix|bug|hotfix|update) ]]; then
          BUMP_TYPE="patch"
        else
          BUMP_TYPE="patch"
        fi
        
        # Get current version
        if [ -f "package.json" ]; then
          CURRENT_VERSION=$(node -p "require('./package.json').version")
        else
          CURRENT_VERSION="1.0.0"
        fi
        
        # Calculate new version
        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}
        
        case $BUMP_TYPE in
          "major")
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          "minor")
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          "patch")
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
        
    - name: Update version in package.json
      run: |
        npm version ${{ steps.version.outputs.version }} --no-git-tag-version
        
    - name: Bundle NavBot
      run: |
        node bundle.js
        
    - name: Upload NavBot.lua
      uses: actions/upload-artifact@v3
      with:
        name: NavBot-v${{ steps.version.outputs.version }}
        path: NavBot.lua
        retention-days: 30
        
    - name: Create simple release notes
      run: |
        echo "## NavBot v${{ steps.version.outputs.version }}" > release_notes.md
        echo "" >> release_notes.md
        echo "**Changes:** ${{ github.event.head_commit.message }}" >> release_notes.md
        echo "**Version bump:** ${{ steps.version.outputs.bump_type }}" >> release_notes.md
        echo "" >> release_notes.md
        echo "Download NavBot.lua from the artifacts section above." >> release_notes.md
        
    - name: Upload release notes
      uses: actions/upload-artifact@v3
      with:
        name: Release-Notes-v${{ steps.version.outputs.version }}
        path: release_notes.md
        retention-days: 30
